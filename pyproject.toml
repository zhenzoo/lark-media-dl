[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-media-dl"
version = "0.1.0"
description = "Personal media downloads, an agent Skill and an optional Miaoda workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zhenzoo"}]
dependencies = ["requests>=2.32,<3", "yt-dlp[default]>=2026.3.17", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
oss = ["oss2>=2.19,<3"]

[project.scripts]
media-dl = "media_dl.cli:main"
media-dl-doctor = "media_dl.doctor:main"
media-dl-worker = "media_dl.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
